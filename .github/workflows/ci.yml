name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # backend: lint + test (Python 3.12, no live services needed — all fakes)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      # Install the LOCK, not requirements.txt. requirements.txt is unpinned, so CI resolved
      # whatever was newest while the working venv stayed months old, and the two drifted until a
      # release exposed it — three times in one afternoon: anthropic dropped `temperature` from the
      # Messages signature, starlette moved to httpx2 so httpx stopped arriving transitively, and
      # the mcp SDK moved `mcp.server.fastmcp`. None were code defects; all three were the same
      # missing pin. requirements.txt stays as the human-readable statement of intent.
      #
      # pywin32 is dropped — Windows-only wheel, no Linux distribution (same as the Dockerfile).
      # ruff, mypy and pytest-cov are not in the lock (it freezes the runtime venv), so they are
      # installed on top; they are linters, and a new version of one failing the build is a
      # signal worth having rather than drift worth hiding.
      - name: Install dependencies
        run: |
          grep -ivE '^pywin32' requirements.lock.txt > /tmp/locked.txt
          pip install -r /tmp/locked.txt
          pip install pytest-cov ruff mypy

      - name: Lint (ruff)
        run: ruff check synapse tests scripts

      # Config in pyproject.toml [tool.mypy]; scoped to synapse/ and clean, so a new
      # type error fails the build rather than accumulating.
      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest
        env:
          # Tests use fakes; no live Neo4j/Redis/Ollama/Anthropic needed.
          # Dummy values so pydantic-settings doesn't error on missing env vars.
          ANTHROPIC_API_KEY: "ci-fake"
          NEO4J_PASSWORD: "ci-fake"

  # ---------------------------------------------------------------------------
  # frontend: build (Node 22, React+TS+Vite)
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
