# Serves the static SPA and reverse-proxies the API + WebSocket to the api container.
# The upstream is held in a variable + Docker's embedded DNS resolver (127.0.0.11) so nginx
# resolves `api` per-request rather than pinning its IP at startup — this survives api
# restarts and lets the config boot even before api is up. 8848 is api's container port.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # REST API — variable proxy_pass with no URI preserves the original path (/api/v1/...).
    location /api/ {
        set $upstream api:8848;
        proxy_pass http://$upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — real-time graph updates. Needs the Upgrade/Connection dance.
    location /ws {
        set $upstream api:8848;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;   # long-lived; don't reap idle sockets
    }

    # Hashed asset bundles are immutable; cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — client-side routing (react-router) serves index.html for any path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
